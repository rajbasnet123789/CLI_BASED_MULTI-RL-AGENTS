[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "orion-ai"
version = "1.0.5"
description = "Orion AI - a multi-agent coding assistant for your terminal, powered by Vertex AI via gcloud ADC, LangGraph, and ChromaDB."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Orion AI contributors" }]
keywords = [
  "ai",
  "coding-assistant",
  "gemini",
  "ollama",
  "local-llm",
  "langgraph",
  "rag",
  "chromadb",
  "cli",
  "tui",
  "agents",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Code Generators",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
dependencies = [
  "google-genai>=1.0.0,<2",
  # langgraph >=0.4 and langsmith >=0.10 pull in xxhash, whose native DLL is
  # blocked by Application Control on some Windows machines. These versions
  # keep the full agent graph working without that native dependency.
  "langgraph>=0.2.60,<0.3.0",
  "langchain-core>=0.2.43,<0.4.0",
  "langsmith>=0.3.45,<0.6.7",
  "chromadb>=0.5.20,<2",
  "typer>=0.12.5,<0.17",
  "rich>=13.9.0",
  "textual>=0.90.0",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "python-dotenv>=1.0",
  "platformdirs>=4.2",
]

[project.optional-dependencies]
server = ["fastapi>=0.115", "uvicorn>=0.30"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "build>=1.2",
  "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/orion-ai/orion"
Documentation = "https://github.com/orion-ai/orion#readme"
Repository = "https://github.com/orion-ai/orion"
Issues = "https://github.com/orion-ai/orion/issues"

[project.scripts]
orion = "orion.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/orion"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/README.md",
  "/LICENSE",
  "/pyproject.toml",
  "/Dockerfile",
  "/docker-compose.yml",
  "/.dockerignore",
  "/.env.example",
  "/Makefile",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "B008", "SIM105"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["orion"]
